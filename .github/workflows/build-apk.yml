name: Construir APK BET-AI

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev \
            libssl-dev automake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Compilar APK
        working-directory: android_app
        run: buildozer android debug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BET-AI-Android
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
