name: Compilar aplicativo Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Gerar APK do BET-AI
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java e dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            gettext \
            curl

      - name: Configurar Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Preparar ferramentas Android
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          echo "Diretorio Android preparado."
          echo "O Buildozer instalara as ferramentas necessarias."

      - name: Compilar APK
        working-directory: android_app
        env:
          P4A_RELEASE: "0"
        run: |
          buildozer android debug

      - name: Verificar APK
        run: |
          echo "Verificando arquivo APK..."
          find android_app/bin -maxdepth 1 -type f -name "*.apk" -print

          if ! find android_app/bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BET-AI-Android
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
