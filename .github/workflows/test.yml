name: BET-AI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:

  bet-ai:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verificar API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -c "import os; key=os.getenv('API_FOOTBALL_KEY'); assert key, 'API_FOOTBALL_KEY não encontrada'; print('API_FOOTBALL_KEY configurada corretamente.')"

      - name: Executar BET-AI
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python main.py

      - name: Verificar memória
        if: always()
        run: |
          if [ -f data/memory.json ]; then
            echo "✓ memory.json existe."
            echo "Tamanho:"
            wc -c data/memory.json
          else
            echo "⚠ memory.json ainda não existe."
          fi

      - name: Salvar memória do BET-AI
        if: always()
        run: |
          if [ ! -f data/memory.json ]; then
            echo "Nenhuma memória para salvar."
            exit 0
          fi

          git config user.name "BET-AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/memory.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na memória."
          else
            git commit -m "BET-AI: atualizar memória [skip ci]"
            git push
          fi
