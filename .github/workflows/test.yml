name: Testar BET-AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Testar API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.getenv("API_FOOTBALL_KEY")

          if not key:
              raise SystemExit("ERRO: API_FOOTBALL_KEY não encontrada.")

          url = "https://v3.football.api-sports.io/fixtures"

          response = requests.get(
              url,
              headers={
                  "x-apisports-key": key
              },
              params={
                  "date": "2026-09-27"
              },
              timeout=30
          )

          print("Status da API:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit("ERRO ao consultar a API.")

          data = response.json()
          jogos = data.get("response", [])

          print("API-Football conectada com sucesso!")
          print("Jogos encontrados:", len(jogos))

      - name: Executar BET-AI
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python main.py
